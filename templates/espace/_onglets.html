{% load i18n %}{% with page=request.resolver_match.url_name %}
<div class="page-head pb-3">
    <span class="badge-soft"><i class="bi bi-person-workspace"></i> {% translate "Mon espace étudiant" %}</span>
    <h1 class="mt-3">{{ titre }}</h1>
    <p>{{ sous_titre }}</p>
</div>
<nav class="onglets-espace mb-4" aria-label="{% translate "Mon espace étudiant" %}">
    <a href="{% url 'dashboard' %}" class="onglet-espace"><i class="bi bi-grid"></i> {% translate "Tableau de bord" %}</a>
    <a href="{% url 'espace:filiere' %}" class="onglet-espace {% if page == 'filiere' %}actif{% endif %}"><i class="bi bi-mortarboard"></i> {% translate "Ma filière" %}</a>
    <a href="{% url 'espace:emploi_du_temps' %}" class="onglet-espace {% if page == 'emploi_du_temps' %}actif{% endif %}"><i class="bi bi-calendar-week"></i> {% translate "Emploi du temps" %}</a>
    <a href="{% url 'espace:suivi' %}" class="onglet-espace {% if page == 'suivi' %}actif{% endif %}"><i class="bi bi-graph-up-arrow"></i> {% translate "Mon suivi" %}</a>
    <a href="{% url 'communaute:messagerie' %}" class="onglet-espace"><i class="bi bi-envelope"></i> {% translate "Messages" %}</a>
</nav>
{% endwith %}
